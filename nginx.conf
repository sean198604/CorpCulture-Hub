# ============================================================
# nginx.conf — CorpCulture-Hub 本地静态文件服务器配置
# ============================================================
# 功能要点：
#   1. 监听 80 端口
#   2. 设置默认字符集为 UTF-8（避免中文乱码）
#   3. 为 SPA 配置 history 路由兜底（try_files），防止刷新 404
#   4. 为静态资源设置合理的 MIME 类型和缓存策略
# ============================================================

server {
    # 监听容器内 80 端口（宿主机映射到 7009）
    listen 80;
    # 服务名
    server_name localhost;

    # 网站根目录（Dockerfile 中将 dist 内容拷贝到此处）
    root /usr/share/nginx/html;
    # 默认入口文件
    index index.html;

    # 默认字符集
    charset utf-8;

    # ----- HTML 文件禁止缓存（确保每次获取最新版本） -----
    # 浏览器对 HTML 启用启发式缓存会导致更新后页面不刷新
    # 必须显式声明 no-cache，让浏览器每次都向服务器验证
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires off;
    }
    location = / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires off;
        try_files /index.html =404;
    }

    # ----- 活动图片上传服务（Node 后端，容器内 3000） -----
    # ^~ 优先于正则，避免被下方静态资源正则拦截
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 16m;
    }

    # ----- 活动图片静态服务（按活动归档，容器内 /data/uploads） -----
    location ^~ /uploads/ {
        alias /data/uploads/;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # ----- SPA 路由兜底 -----
    # 前端使用 hash 路由（#/）或 history 路由
    # history 路由刷新时浏览器会向服务器请求子路径
    # try_files 确保：先找实际文件 → 再找目录 → 都找不到则返回 index.html
    # 这样 SPA 的前端路由可以正常接管页面渲染
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ----- 静态资源缓存优化 -----
    # 对 .js / .css / 图片等静态资源设置较长缓存
    # 注意：带哈希的文件名变更时浏览器会自动请求新文件
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ----- 安全头 -----
    # 防止 MIME 嗅探攻击
    add_header X-Content-Type-Options "nosniff" always;
    # 防止点击劫持
    add_header X-Frame-Options "SAMEORIGIN" always;

    # ----- 错误页面 -----
    # 404 时回退到 index.html（SPA 友好）
    error_page 404 /index.html;

    # ----- gzip 压缩 -----
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 5;

    # ----- 关闭不必要的日志（减少磁盘 IO） -----
    access_log off;
}
